<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자율주행 AI 평가 대시보드 - AI 드라이빙 멘토</title>
  
  <!-- Google Fonts: Outfit & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- SheetJS & Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* CSS 디자인 시스템 정의 */
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(21, 29, 48, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      
      --neon-blue: #38bdf8;
      --neon-blue-glow: rgba(56, 189, 248, 0.25);
      --neon-green: #10b981;
      --neon-gold: #fbbf24;
      --neon-gold-glow: rgba(251, 191, 36, 0.3);
      --neon-red: #ef4444;
      
      --font-outfit: 'Outfit', sans-serif;
      --font-noto: 'Noto Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-noto);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.3) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(17, 24, 39, 0.7) 0px, transparent 50%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 상단 헤더 */
    .dashboard-header {
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: relative; /* absolute 버튼 정렬용 */
      top: 0;
      z-index: 100;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 120px; /* 뒤로가기 공간 확보 */
    }

    .header-logo h1 {
      font-family: var(--font-outfit);
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--neon-blue) 0%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .header-logo span {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--neon-blue);
      color: var(--neon-blue);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 0 0 10px var(--neon-blue-glow);
    }

    /* 통일된 뒤로가기 버튼 스타일 (왼쪽 상단) */
    .back-link {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    
    .back-link:hover {
      color: white;
      background: rgba(255, 255, 255, 0.12);
    }

    /* 메인 영역 */
    .dashboard-container {
      max-width: 1300px;
      width: 100%;
      margin: 32px auto;
      padding: 0 24px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* 파일 드롭존 (업로드 페이지) */
    .upload-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      padding: 40px;
      text-align: center;
      transition: border 0.3s, box-shadow 0.3s;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .drop-zone {
      border: 2px dashed rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      padding: 60px 40px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--neon-blue);
      background: rgba(56, 189, 248, 0.05);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.1);
      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 4.5rem;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .upload-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .upload-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .select-file-btn {
      background: linear-gradient(135deg, var(--neon-blue) 0%, #0284c7 100%);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
      transition: all 0.25s;
    }

    .select-file-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(2, 132, 199, 0.5);
    }

    /* 대시보드 메인 레이아웃 (기본 숨김) */
    .dashboard-layout {
      display: none;
      flex-direction: column;
      gap: 28px;
      animation: fadeIn 0.6s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 상단 요약 바 */
    .dashboard-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .toolbar-title {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .reset-file-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-light);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .reset-file-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--text-muted);
    }

    /* KPI 카드 그리드 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .kpi-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--neon-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .kpi-card:nth-child(2) .kpi-icon-box {
      background: rgba(16, 185, 129, 0.1);
      color: var(--neon-green);
    }

    .kpi-card:nth-child(3) .kpi-icon-box {
      background: rgba(251, 191, 36, 0.1);
      color: var(--neon-gold);
    }

    .kpi-card:nth-child(4) .kpi-icon-box {
      background: rgba(239, 68, 68, 0.1);
      color: var(--neon-red);
    }

    .kpi-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .kpi-value {
      font-family: var(--font-outfit);
      font-size: 1.8rem;
      font-weight: 800;
    }

    .kpi-subtext {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: -2px;
    }

    /* 2열 레이아웃 그리드 (리더보드 vs 차트) */
    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 28px;
    }

    @media (max-width: 1024px) {
      .grid-2col {
        grid-template-columns: 1fr;
      }
    }

    /* 대시보드 패널 카드 */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 14px;
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 순위표 리스트 */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .leaderboard-list::-webkit-scrollbar, .table-wrapper::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .leaderboard-list::-webkit-scrollbar-track, .table-wrapper::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
    }
    .leaderboard-list::-webkit-scrollbar-thumb, .table-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .rank-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }

    .rank-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.07);
    }

    .rank-badge {
      width: 40px;
      font-family: var(--font-outfit);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .rank-item.rank-1 .rank-badge { color: var(--neon-gold); text-shadow: 0 0 8px var(--neon-gold-glow); }
    .rank-item.rank-2 .rank-badge { color: #cbd5e1; }
    .rank-item.rank-3 .rank-badge { color: #f97316; }

    .rank-car-info {
      min-width: 180px;
      max-width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .rank-car-name {
      font-weight: 800;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }

    .rank-car-tries {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .rank-gauge-box {
      flex-grow: 1;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rank-gauge-bg {
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
    }

    .rank-gauge-fill {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      background: var(--neon-blue);
      box-shadow: 0 0 8px var(--neon-blue-glow);
      transition: width 1.5s cubic-bezier(0.1, 0.8, 0.3, 1);
    }

    .rank-item.rank-1 .rank-gauge-fill {
      background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%);
      box-shadow: 0 0 10px var(--neon-gold-glow);
    }

    .rank-score {
      font-family: var(--font-outfit);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--neon-blue);
      text-align: right;
      width: 70px;
    }

    .rank-item.rank-1 .rank-score { color: var(--neon-gold); }

    /* 차트 및 컨트롤러 */
    .chart-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chart-select {
      background: #151d30;
      border: 1px solid var(--card-border);
      color: var(--text-light);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .chart-select:focus {
      border-color: var(--neon-blue);
    }

    .chart-container {
      position: relative;
      flex-grow: 1;
      min-height: 380px;
      width: 100%;
    }

    /* 하단 테이블 */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background: rgba(15, 23, 42, 0.6);
      font-weight: 700;
      color: var(--text-muted);
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.85);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.01);
      color: white;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--neon-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--neon-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* 반응형 스타일 */
    @media (max-width: 768px) {
      .dashboard-header {
        padding: 16px 20px;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        text-align: center;
      }
      .header-logo {
        margin-left: 0;
        flex-direction: column;
      }
      .back-link {
        position: static;
        transform: none;
        display: inline-flex;
        margin-bottom: 8px;
      }
      .dashboard-container {
        padding: 0 16px;
        margin: 20px auto;
      }
      .panel {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header class="dashboard-header">
    <a href="index.html?start=true" class="back-link">⬅️ 메인 화면</a>
    <div class="header-logo">
      <h1>🏎️ AUTONOMOUS Speedway</h1>
      <span>실시간 통계 대시보드</span>
    </div>
  </header>

  <main class="dashboard-container">
    
    <!-- 1. 파일 업로드 존 (데이터가 없을 때 표시) -->
    <div class="upload-wrapper" id="uploadWrapper">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📊</div>
        <h2 class="upload-title">실시간 평가 데이터를 수신하고 있습니다...</h2>
        <p class="upload-desc">
          구글 스프레드시트에서 실시간 실습 통계 데이터를 긁어오는 중입니다.
        </p>
        <button class="select-file-btn">컴퓨터에서 파일 선택 (수동)</button>
      </div>
      <input type="file" id="fileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleFile(event)">
    </div>

    <!-- 2. 대시보드 레이아웃 (데이터가 들어오면 활성화) -->
    <div class="dashboard-layout" id="dashboardLayout">
      
      <!-- 상단 컨트롤 툴바 -->
      <div class="dashboard-toolbar">
        <div class="toolbar-title">📈 실시간 평가 데이터 요약 리포트</div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="reset-file-btn" onclick="fetchLiveGoogleSheet()" style="background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.3); color: var(--neon-blue); padding: 8px 16px;">🔄 실시간 구글 시트 동기화</button>
        </div>
      </div>

      <!-- 중간 그리드 영역 (리더보드 및 꺾은선 차트) -->
      <div class="grid-2col">
        
        <!-- 왼쪽 패널: 차량 랭킹 리더보드 -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">🏆 자율주행 랭킹 보드</div>
          </div>
          <div class="leaderboard-list" id="leaderboardList">
            <!-- 랭킹 항목이 동적으로 생성됩니다 -->
          </div>
        </div>

        <!-- 오른쪽 패널: 회차별 성장 곡선 차트 -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">📊 학교별 자동차 최고 정확도 비교</div>
          </div>
          <div class="chart-container">
            <canvas id="growthChart"></canvas>
          </div>
        </div>

      </div>

      <!-- 하단 패널: 원본 데이터 상세 테이블 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">📋 주행 원본 데이터 상세 조회</div>
          <div class="chart-controls">
            <!-- 동적으로 파싱된 학교 목록 드롭다운으로 대체 -->
            <select class="chart-select" id="tableFilterSelect" onchange="updateTableData()">
              <option value="all">모든 학교 기록 보기</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>순번</th>
                <th>주행 시간</th>
                <th>차량 번호</th>
                <th>코스 트랙</th>
                <th>정확도 (점수)</th>
                <th>상태 판정</th>
              </tr>
            </thead>
            <tbody id="rawTableBody">
              <!-- 데이터 행들이 동적으로 생성됩니다 -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <footer class="app-footer">
    © 2026 AI 드라이빙 멘토 • 자율주행 궤적 평가시스템 대시보드
  </footer>

  <script>
    // 차량 번호에서 학교명 추출하는 유틸리티
    function getSchoolName(carNumber) {
      if (!carNumber) return "일반";
      const match = String(carNumber).match(/^\[(.*?)\]/);
      return match ? match[1].trim() : "일반";
    }

    // 차량 번호에서 [학교명]을 제외한 순수 차량명 추출
    function getPureCarNumber(carNumber) {
      if (!carNumber) return "";
      return String(carNumber).replace(/^\[.*?\]\s*/, "");
    }

    // 전역 변수 정의
    let parsedData = [];     // 가공 원본 데이터
    let carSummaryMap = {};   // 차량별 통계 매핑 데이터
    let myChart = null;       // Chart.js 인스턴스

    // 드래그 앤 드롭 이벤트 추가
    const dropZone = document.getElementById('dropZone');
    
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        document.getElementById('fileInput').files = files;
        handleFile({ target: { files: files } });
      }
    }, false);

    // 엑셀 파일 리딩 및 파싱 함수
    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];
          
          const rawJson = XLSX.utils.sheet_to_json(worksheet, { raw: true });
          
          processExcelData(rawJson);
        } catch (error) {
          console.error("엑셀 파싱 에러:", error);
          alert("엑셀 파일 파싱에 실패했습니다. 올바른 형식의 자율주행 데이터 파일인지 확인해 주세요.");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // 엑셀 날짜 일련번호를 포맷 문자열로 변환
    function formatExcelDate(serial) {
      if (!serial || isNaN(serial)) return "기록 없음";
      
      try {
        const utc_days = Math.floor(serial - 25569);
        const utc_value = utc_days * 86400;
        const date_info = new Date(utc_value * 1000);

        const fractional_day = serial - Math.floor(serial) + 0.0000001;
        let total_seconds = Math.floor(86400 * fractional_day);

        const seconds = total_seconds % 60;
        total_seconds = Math.floor(total_seconds / 60);
        const minutes = total_seconds % 60;
        const hours = Math.floor(total_seconds / 60);

        const finalDate = new Date(date_info.getFullYear(), date_info.getMonth(), date_info.getDate(), hours, minutes, seconds);
        
        const pad = (n) => String(n).padStart(2, '0');
        return `${finalDate.getFullYear()}-${pad(finalDate.getMonth() + 1)}-${pad(finalDate.getDate())} ` +
               `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      } catch (err) {
        return "형식 변환 에러";
      }
    }

    // 파싱된 데이터를 구조화 및 가공
    function processExcelData(json) {
      parsedData = [];
      carSummaryMap = {};

      json.forEach(row => {
        let timeRaw = row["시간"] || row["Time"] || null;
        let carNum = row["차량번호"] || row["CarNumber"] || row["차량 번호"] || null;
        let track = row["트랙"] || row["Track"] || "일반";
        let accuracyRaw = row["정확도"] || row["Accuracy"] || null;

        if (carNum && accuracyRaw !== null && accuracyRaw !== undefined) {
          const carStr = String(carNum).trim();
          // [퀴즈] 및 [설문-] 접두사로 시작하는 학습 데이터는 대시보드 주행 통계 분석에서 원천 필터링
          if (carStr.startsWith('[퀴즈]') || carStr.startsWith('[설문-') || carStr.includes('설문') || carStr.includes('퀴즈')) {
            return;
          }

          let accuracy = parseFloat(accuracyRaw);
          if (isNaN(accuracy)) accuracy = 0;
          
          const timeString = formatExcelDate(timeRaw);

          parsedData.push({
            timeRaw: parseFloat(timeRaw) || 0,
            timeString,
            carNumber: carStr,
            schoolName: getSchoolName(carStr), // 소속 학교 파싱
            track: String(track).trim(),
            accuracy
          });
        }
      });

      if (parsedData.length === 0) {
        alert("분석할 수 있는 자율주행 기록 데이터가 엑셀 파일 내에 존재하지 않습니다.");
        return;
      }

      parsedData.sort((a, b) => a.timeRaw - b.timeRaw);

      // UI 렌더링 시작
      document.getElementById('uploadWrapper').style.display = 'none';
      document.getElementById('dashboardLayout').style.display = 'flex';

      buildSchoolDropdown();  // 동적으로 수집된 학교명 드롭다운 생성
      updateDashboardViews(); // 전체 통합 요약 대시보드 갱신
      updateTableData();      // 상세 테이블 갱신
    }

    // 고유 학교명 리스트를 추출해 상세 테이블 드롭다운에 장착
    function buildSchoolDropdown() {
      const select = document.getElementById('tableFilterSelect');
      if (!select) return;

      const schoolsSet = new Set();
      parsedData.forEach(item => {
        schoolsSet.add(item.schoolName);
      });
      const sortedSchools = Array.from(schoolsSet).sort();

      select.innerHTML = '<option value="all">모든 학교 기록 보기</option>';
      sortedSchools.forEach(school => {
        const option = document.createElement('option');
        option.value = school;
        option.innerText = `[${school}] 기록 필터`;
        select.appendChild(option);
      });
    }

    // 전체 대시보드 통계 및 꺾은선 차트 렌더링 (전체 데이터 기반)
    function updateDashboardViews() {
      carSummaryMap = {};
      
      parsedData.forEach(item => {
        if (!carSummaryMap[item.carNumber]) {
          carSummaryMap[item.carNumber] = {
            carNumber: item.carNumber, // [학교명]을 포함하는 본래 차량 명칭을 그대로 표시
            maxAccuracy: 0,
            sumAccuracy: 0,
            tries: 0,
            history: []
          };
        }
        
        const summary = carSummaryMap[item.carNumber];
        summary.tries += 1;
        summary.sumAccuracy += item.accuracy;
        if (item.accuracy > summary.maxAccuracy) {
          summary.maxAccuracy = item.accuracy;
        }
        summary.history.push({
          attempt: summary.tries,
          accuracy: item.accuracy,
          timeString: item.timeString
        });
      });

      renderLeaderboard();
      initChart(parsedData);
    }

    // 리더보드 순위표 렌더링
    function renderLeaderboard() {
      const container = document.getElementById('leaderboardList');
      container.innerHTML = "";

      const rankList = Object.values(carSummaryMap).sort((a, b) => b.maxAccuracy - a.maxAccuracy);

      rankList.forEach((car, index) => {
        const rank = index + 1;
        let badgeSymbol = rank;
        if (rank === 1) badgeSymbol = '🥇';
        else if (rank === 2) badgeSymbol = '🥈';
        else if (rank === 3) badgeSymbol = '🥉';

        const maxAcc = car.maxAccuracy.toFixed(1);

        const itemHTML = `
          <div class="rank-item rank-${rank <= 3 ? rank : 'other'}">
            <div class="rank-badge">${badgeSymbol}</div>
            <div class="rank-car-info">
              <div class="rank-car-name">${car.carNumber}</div>
              <div class="rank-car-tries">총 시도: ${car.tries}회</div>
            </div>
            <div class="rank-gauge-box">
              <div class="rank-gauge-bg">
                <div class="rank-gauge-fill" id="rankGauge-${rank}" style="width: 0%"></div>
              </div>
            </div>
            <div class="rank-score">${maxAcc}%</div>
          </div>
        `;
        container.innerHTML += itemHTML;
      });

      setTimeout(() => {
        rankList.forEach((car, index) => {
          const rank = index + 1;
          const bar = document.getElementById(`rankGauge-${rank}`);
          if (bar) bar.style.width = car.maxAccuracy + '%';
        });
      }, 100);
    }

    // 차트 데이터 셋업 생성기 (학교별 다중 꺾은선 대조 비교 버전)
    function getChartDataSetup() {
      // 1. 고유한 순수 차량번호 목록 수집 및 오름차순 정렬 (x축 라벨)
      const carNamesSet = new Set();
      parsedData.forEach(item => {
        carNamesSet.add(getPureCarNumber(item.carNumber));
      });
      const xAxisCarLabels = Array.from(carNamesSet).sort((a, b) => {
        const numA = parseInt(a.replace(/[^0-9]/g, '')) || 0;
        const numB = parseInt(b.replace(/[^0-9]/g, '')) || 0;
        return numA - numB;
      });

      // 2. 학교명 목록 수집 및 정렬
      const schoolsSet = new Set();
      parsedData.forEach(item => {
        schoolsSet.add(item.schoolName);
      });
      const schoolsList = Array.from(schoolsSet).sort();

      // 3. 각 학교별 / 순수 차량별 최고 정확도 매핑 연산
      const schoolCarMaxMap = {};
      parsedData.forEach(item => {
        const school = item.schoolName;
        const pureCar = getPureCarNumber(item.carNumber);
        if (!schoolCarMaxMap[school]) schoolCarMaxMap[school] = {};
        if (!schoolCarMaxMap[school][pureCar] || item.accuracy > schoolCarMaxMap[school][pureCar]) {
          schoolCarMaxMap[school][pureCar] = item.accuracy;
        }
      });

      // 4. 차트 라인 컬러 팔레트 정의 (A고등학교, B고등학교, C고등학교 테마 맞춤형)
      const chartColors = [
        { border: '#38bdf8', bg: 'rgba(56, 189, 248, 0.05)' }, // A고등학교: 시안 블루
        { border: '#10b981', bg: 'rgba(16, 185, 129, 0.05)' }, // B고등학교: 에메랄드 그린
        { border: '#fbbf24', bg: 'rgba(251, 191, 36, 0.05)' }, // C고등학교: 골드 옐로우
        { border: '#a855f7', bg: 'rgba(168, 85, 247, 0.05)' }, // 보라색
        { border: '#ec4899', bg: 'rgba(236, 72, 153, 0.05)' }  // 핑크색
      ];

      // 5. 학교별 dataset 구축
      const datasets = schoolsList.map((school, idx) => {
        const color = chartColors[idx % chartColors.length];
        const dataValues = xAxisCarLabels.map(pureCar => {
          // 해당 차량 주행 데이터가 존재하면 최고 정확도 반환, 없으면 null (선 끊김 처리 가능)
          return schoolCarMaxMap[school][pureCar] !== undefined ? schoolCarMaxMap[school][pureCar] : null;
        });

        return {
          label: school,
          data: dataValues,
          borderColor: color.border,
          backgroundColor: color.bg,
          fill: false,
          tension: 0.2,
          borderWidth: 3.5,
          pointBackgroundColor: color.border,
          pointBorderColor: '#0b0f19',
          pointBorderWidth: 2.5,
          pointRadius: 6,
          pointHoverRadius: 8,
          spanGaps: true // 중간에 데이터가 빠져도 선이 자연스럽게 이어지도록 설정
        };
      });

      return {
        labels: xAxisCarLabels,
        datasets: datasets
      };
    }

    // 학교별 차량 비교 차트 렌더링 헬퍼
    function initChart() {
      const ctx = document.getElementById('growthChart').getContext('2d');
      
      const config = {
        type: 'line',
        data: getChartDataSetup(),
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true, // 학교별 다중 선을 구별하도록 범례 표출
              position: 'top',
              labels: {
                color: '#e2e8f0',
                font: {
                  family: 'Noto Sans KR',
                  size: 11,
                  weight: '600'
                },
                padding: 15,
                usePointStyle: true,
                pointStyle: 'circle'
              }
            },
            tooltip: {
              backgroundColor: '#1e293b',
              titleColor: '#f8fafc',
              bodyColor: '#38bdf8',
              borderColor: 'rgba(255, 255, 255, 0.08)',
              borderWidth: 1,
              padding: 12,
              callbacks: {
                label: function(context) {
                  return ` ${context.dataset.label}: ${context.raw.toFixed(1)}%`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(255, 255, 255, 0.04)', borderColor: 'rgba(255, 255, 255, 0.08)' },
              ticks: {
                color: '#cbd5e1',
                font: { family: 'Noto Sans KR', weight: '500' }
              }
            },
            y: {
              min: 0, max: 100,
              grid: { color: 'rgba(255, 255, 255, 0.04)', borderColor: 'rgba(255, 255, 255, 0.08)' },
              ticks: {
                color: '#94a3b8',
                callback: function(value) { return value + '%'; }
              }
            }
          }
        }
      };

      if (myChart) myChart.destroy();
      myChart = new Chart(ctx, config);
    }

    // 주행 원본 데이터 상세 조회 필터링 렌더링 (드롭다운 학교 선택값 기준)
    function updateTableData() {
      const select = document.getElementById('tableFilterSelect');
      const filterValue = select ? select.value : "all";
      const tbody = document.getElementById('rawTableBody');
      tbody.innerHTML = "";

      let listData = parsedData;
      if (filterValue !== "all") {
        listData = parsedData.filter(item => item.schoolName === filterValue);
      }

      listData.forEach((item, index) => {
        const attempt = index + 1;
        const isSuccess = item.accuracy >= 70; 
        const statusBadge = isSuccess 
          ? `<span class="badge badge-success">성공</span>` 
          : `<span class="badge badge-danger">실패</span>`;

        const rowHTML = `
          <tr>
            <td style="font-family: var(--font-outfit); font-weight: 600;">#${attempt}</td>
            <td style="font-size: 0.85rem; color: var(--text-muted);">${item.timeString}</td>
            <td style="font-weight: 700; color: var(--neon-blue);">${item.carNumber}</td>
            <td>${item.track} 코스</td>
            <td style="font-family: var(--font-outfit); font-weight: 800; font-size: 1rem;">${item.accuracy.toFixed(1)}%</td>
            <td>${statusBadge}</td>
          </tr>
        `;
        tbody.innerHTML += rowHTML;
      });
    }

    // 다른 파일 로드 초기화
    function resetFile() {
      document.getElementById('fileInput').value = "";
      document.getElementById('uploadWrapper').style.display = 'flex';
      document.getElementById('dashboardLayout').style.display = 'none';
      
      const uploadZoneText = document.querySelector('.upload-title');
      const uploadDesc = document.querySelector('.upload-desc');
      if (uploadZoneText) {
        uploadZoneText.innerText = "엑셀 데이터를 업로드하세요";
        uploadDesc.innerHTML = "자율주행 평가 시스템의 기록 엑셀 파일인<br><strong>자율주행평가시스템(데시보드+게이지).xlsx</strong>를 드래그 앤 드롭하거나 선택해 주세요.";
      }
      
      parsedData = [];
      carSummaryMap = {};
      if (myChart) {
        myChart.destroy();
        myChart = null;
      }
    }

    // 구글 스프레드시트 실시간 데이터 동기화 엔진 추가 (설문조사 시트 분기 버전)
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyqByrOwTpZ_S2zXEl8-flEBjBqirZXbrY-Bx5TOFIu3AHpSbm4U7gBinN0eb1j5dA/exec";

    function fetchLiveGoogleSheet() {
      const uploadZoneText = document.querySelector('.upload-title');
      const uploadDesc = document.querySelector('.upload-desc');
      if (uploadZoneText) {
        uploadZoneText.innerText = "⚙️ 실시간 구글 시트 연결 중...";
        uploadDesc.innerText = "구글 스프레드시트에서 실습 데이터를 비동기로 동기화하고 있습니다. 잠시만 기다려 주세요.";
      }

      fetch(`${GAS_WEBAPP_URL}?action=getLeaderboard`, { method: 'GET', mode: 'cors', redirect: 'follow' })
        .then(response => {
          if (!response.ok) throw new Error('Network response was not ok');
          return response.json();
        })
        .then(res => {
          if (res.status === 'success' && res.data && res.data.length > 0) {
            let realRows = [];

            res.data.forEach((car, index) => {
              // 구글 시트 원본의 학교 실명을 "1기수"로 동적 마스킹 처리
              if (car.carNumber) {
                car.carNumber = String(car.carNumber).replace(/덕암정보고|전주공고/g, "1기수");
              }
              if (car.school) {
                car.school = String(car.school).replace(/덕암정보고|전주공고/g, "1기수");
              }
              const carStr = String(car.carNumber || '').trim();
              if (!carStr) return;
              
              // [퀴즈] 및 [설문-] 접두사를 가진 비주행 데이터만 원천 제외 (주행 실패 0% 기록은 100% 포함)
              if (carStr.startsWith('[퀴즈]') || carStr.startsWith('[설문-') || carStr.includes('설문') || carStr.includes('퀴즈')) {
                return;
              }

              // 정확도 수치 파싱 (0%나 공백도 0점 주행 실패 기록으로 100% 유효 파싱)
              let finalAcc = parseFloat(car.accuracy);
              if (isNaN(finalAcc)) finalAcc = 0;

              // 구글 시트에 기재된 원본 타임스탬프 또는 날짜 유지
              let timeSerial = null;
              if (car.timestamp || car.timeRaw || car.time) {
                const rawDate = car.timestamp || car.timeRaw || car.time;
                if (!isNaN(rawDate)) {
                  timeSerial = parseFloat(rawDate);
                } else {
                  // 날짜 문자열인 경우 Excel 일련번호로 변환 시도
                  const parsedTime = new Date(rawDate).getTime();
                  if (!isNaN(parsedTime)) {
                    timeSerial = parsedTime / 1000 / 86400 + 25569;
                  }
                }
              }
              
              // 타임스탬프 정보가 없을 경우 순서대로 기준 시간 산출
              if (!timeSerial) {
                timeSerial = (Date.now() / 1000 / 86400 + 25569) - (res.data.length - index) * 0.001;
              }

              realRows.push({
                "시간": timeSerial,
                "차량번호": carStr,
                "트랙": car.track || "일반 코너",
                "정확도": finalAcc
              });
            });
            
            processExcelData(realRows);
          } else {
            throw new Error('유효 데이터 없음');
          }
        })
        .catch(err => {
          console.error("구글 시트 연동 실패:", err);
          if (uploadZoneText) {
            uploadZoneText.innerText = "엑셀 데이터를 업로드하세요";
            uploadDesc.innerHTML = "자율주행 평가 시스템의 기록 엑셀 파일인<br><strong>자율주행평가시스템(데시보드+게이지).xlsx</strong>를 드래그 앤 드롭하거나 선택해 주세요.<br><br><span style='color: var(--neon-red); font-size: 0.85rem; font-weight: bold;'>⚠️ 실시간 구글 시트 연동 실패. 오프라인(수동 엑셀 업로드) 모드로 전환되었습니다.</span>";
          }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchLiveGoogleSheet();
    });
  </script>
